name: Bug report
description: Report a problem with the customer survey server
title: "[Bug] "
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear and concise description of the bug.
      placeholder: Describe the issue you ran into.
    validations:
      required: true
  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected behavior
      description: What did you expect to happen instead?
    validations:
      required: true
  - type: textarea
    id: steps-to-reproduce
    attributes:
      label: Steps to reproduce
      description: Step-by-step instructions to reproduce the bug.
      placeholder: |
        1. Send request to ...
        2. Observe response ...
        3. ...
    validations:
      required: true
  - type: input
    id: api-endpoint
    attributes:
      label: API endpoint affected
      description: Path and method of the affected route, if applicable.
      placeholder: "GET /api/surveys/{id}"
    validations:
      required: false
  - type: textarea
    id: request-response-example
    attributes:
      label: Request/response example
      description: Paste a sample request and response (redact secrets).
      render: shell
    validations:
      required: false
  - type: input
    id: environment
    attributes:
      label: Environment (Python version, deployment)
      description: e.g. Python 3.11, local / staging / production
      placeholder: "Python 3.11, staging (Vercel)"
    validations:
      required: false
